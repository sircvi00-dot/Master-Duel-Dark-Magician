<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dark Magician Trainer</title>
<meta name="theme-color" content="#f2f1f6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --wine:#24143a; --deep:#1c1030; --ember:#6a3c9c; --flame:#9b6be0;
  --gold:#94681a; --steel:#5f6f88; --bone:#221a2c; --mute:#615a6c;
  --display:"Marcellus SC", "Trajan Pro", Georgia, serif;
  --ui:"Barlow Semi Condensed", "Segoe UI", Roboto, Arial, sans-serif;
}
*{box-sizing:border-box}
html{background:#f2f1f6}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--ui); color:var(--bone); font-size:16px; line-height:1.45;
  background:
    linear-gradient(180deg, #f7f6fa 0%, #ecebf2 100%);
  background-attachment:fixed;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
  -webkit-tap-highlight-color:transparent;
}
button{font-family:var(--ui);font-size:15px;color:var(--bone);background:#fff;
  border:1px solid rgba(226,178,90,.5);border-radius:6px;padding:9px 14px;cursor:pointer;min-height:42px}
button:hover{border-color:var(--gold);background:rgba(226,178,90,.12)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.primary{background:var(--ember);border-color:var(--ember);color:#fff;font-weight:600}
.app{max-width:1100px;margin:0 auto;padding:10px 10px 18px;display:grid;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-family:var(--display);font-weight:700;font-size:20px;margin:0;letter-spacing:.04em;color:var(--gold);white-space:nowrap}
@media (max-width:420px){h1{font-size:16px}.tabs button{padding:6px 9px}}
.tabs{display:flex;gap:4px}
.tabs button{padding:6px 12px;min-height:36px;font-size:14px}
.tabs button.on{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:600}
.lp{display:flex;justify-content:space-between;font-family:var(--display);font-size:14px;color:var(--mute);padding:0 4px}
.lp b{color:var(--bone);font-size:17px;margin-left:6px}
.stage{position:relative;width:100%;margin:0 auto;touch-action:manipulation}
.board{position:absolute;left:0;top:0;width:100%;border-radius:10px;overflow:hidden;
  background:
    linear-gradient(180deg, #e7e5ef 0%, #dedce9 50%, #e8e3ef 100%);
  border:1px solid rgba(0,0,0,.14);box-shadow:inset 0 0 18px rgba(0,0,0,.06)}
.sigil{position:absolute;border-radius:50%;border:1px solid rgba(0,0,0,.1);pointer-events:none}
.sigil.two{border-style:dashed;border-color:rgba(106,60,156,.15)}
.midline{position:absolute;left:4%;right:4%;height:1px;background:linear-gradient(90deg,transparent,rgba(0,0,0,.18),transparent)}
.zone{position:absolute;border:1px solid rgba(0,0,0,.16);background:rgba(255,255,255,.55);border-radius:4px;
  box-shadow:none}
.zone.opp{border-color:rgba(95,112,136,.3);background:rgba(240,244,250,.6)}
.zone.emz{border-radius:50%/12%;border-color:rgba(106,60,156,.45)}
.zone .lab{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:9px;color:rgba(0,0,0,.4);letter-spacing:.02em}
.handbar{position:absolute;left:0;width:100%;border-radius:10px;background:#e5e3ec;border:1px solid rgba(0,0,0,.1)}
.card{position:absolute;left:0;top:0;border-radius:3px;overflow:hidden;cursor:pointer;
  transition:transform .7s cubic-bezier(.2,.8,.2,1), opacity .45s ease, box-shadow .3s;
  box-shadow:0 3px 8px rgba(0,0,0,.28);background:#2a1a3e}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:8px;line-height:1.1;padding:3px;background:linear-gradient(#6a3c9c,#2c1747);color:#fff}
.card .back,.pile{background:
  radial-gradient(ellipse 30% 22% at 50% 50%, #c9a6f2 0 40%, transparent 42%),
  radial-gradient(ellipse 42% 34% at 50% 50%, #4a2475 0 60%, transparent 62%),
  linear-gradient(135deg,#2a1546,#150a24 60%,#2a1546)}
.card .back{position:absolute;inset:0;display:none;border:2px solid #3a2457}
.card .back::after,.pile::after{content:"";position:absolute;inset:16% 12%;border:1.5px solid rgba(226,178,90,.65);border-radius:50%}
.card.down .back{display:block}
.card.down img,.card.down .fb{visibility:hidden}
.card.act{box-shadow:0 0 0 2px var(--gold),0 0 18px 4px rgba(155,107,224,.8);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 2px var(--gold),0 0 28px 8px rgba(155,107,224,.95)}}
.pile{position:absolute;border-radius:3px;border:2px solid #3a2457;box-shadow:2px 3px 0 #140a20,4px 6px 0 #0d0616}
.pile .n{position:absolute;bottom:-1px;right:2px;font-size:10px;color:var(--gold);font-weight:600;z-index:1}
.flash{position:absolute;border-radius:50%;border:2px solid var(--gold);pointer-events:none;
  box-shadow:0 0 30px 6px rgba(226,178,90,.8), inset 0 0 20px rgba(155,107,224,.8);animation:flash 1s ease-out forwards;z-index:80}
@keyframes flash{from{transform:scale(.2);opacity:1}to{transform:scale(1.7);opacity:0}}
.banner{position:absolute;left:0;right:0;text-align:center;font-family:var(--display);font-weight:700;color:var(--gold);
  text-shadow:0 0 10px #fff,0 0 4px #fff,0 2px 6px rgba(106,60,156,.6);color:#5b2d8e;pointer-events:none;z-index:90;animation:ban 1.4s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(1.3)}20%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}
.panel{display:grid;gap:10px;align-content:start}
.caption{background:#fff;border:1px solid rgba(0,0,0,.12);border-radius:10px;padding:12px 14px;min-height:96px}
.caption .k{font-family:var(--display);font-size:13px;color:var(--gold);margin-bottom:4px}
.caption p{margin:0}
.ctrls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ctrls .sp{margin-left:auto;font-size:14px;color:var(--mute);display:flex;gap:6px;align-items:center}
select{font-family:var(--ui);font-size:15px;background:#fff;color:var(--bone);border:1px solid rgba(0,0,0,.2);border-radius:6px;padding:8px}
.opts{display:grid;gap:6px}
.opts button{text-align:left}
.opts button.bad{border-color:var(--ember);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fbk{font-size:15px;color:var(--mute);min-height:22px}
.fbk.ok{color:#2e7d32}.fbk.no{color:#c62828}
.deckview{display:none}
.deckview h2{font-family:var(--display);font-size:16px;color:var(--gold);margin:14px 0 8px;font-weight:500}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.dcard{position:relative;cursor:pointer;border-radius:4px;overflow:hidden;aspect-ratio:59/86;background:#2a1a3e;box-shadow:0 3px 8px rgba(0,0,0,.5)}
.dcard img{width:100%;height:100%;object-fit:cover}
.dcard .q{position:absolute;right:3px;bottom:3px;background:var(--deep);color:var(--gold);border:1px solid var(--gold);border-radius:4px;font-size:12px;padding:0 5px}
.modal{position:fixed;inset:0;background:rgba(30,25,25,.55);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal.on{display:flex}
.mbox{max-width:760px;width:100%;max-height:min(62vh,520px);background:#fbfaf8;
  border:1px solid var(--gold);border-radius:12px;padding:10px;display:grid;gap:10px;grid-template-columns:34% minmax(0,1fr);align-items:start}
.mbox img{width:100%;border-radius:5px;box-shadow:0 4px 12px rgba(0,0,0,.6)}
.mtext{display:flex;flex-direction:column;gap:8px;max-height:calc(min(62vh,520px) - 20px);min-height:0}
.mscroll{overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:0;flex:1}
.mbox h3{font-family:var(--display);color:var(--gold);margin:0;font-size:15px;line-height:1.2}
.mbox .role{background:rgba(226,178,90,.1);border-left:3px solid var(--gold);padding:6px 8px;font-size:13px;line-height:1.35}
.mbox .desc{font-size:12px;line-height:1.45;color:var(--mute);white-space:pre-line}
.mbox #mClose{flex:none;padding:9px}
@media (min-width:760px){.mbox{grid-template-columns:300px minmax(0,1fr);padding:14px;gap:14px}
  .mbox h3{font-size:19px}.mbox .role{font-size:15px}.mbox .desc{font-size:14px}}
.pview{max-width:760px;width:100%;max-height:min(70vh,600px);background:#fbfaf8;border:1px solid var(--gold);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.pview h3{font-family:var(--display);color:var(--gold);margin:0;font-size:17px}
.pview .pg{overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;min-height:0}
.pview .pc{touch-action:none;position:relative;aspect-ratio:59/86;border-radius:4px;overflow:hidden;background:#2a1a3e;cursor:pointer;font-size:10px;color:var(--mute);display:flex;align-items:center;justify-content:center;text-align:center;padding:2px}
.pview .pc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pview .pc .q{position:absolute;right:2px;bottom:2px;background:var(--deep);color:var(--gold);border:1px solid var(--gold);border-radius:4px;font-size:11px;padding:0 4px;z-index:1}
.pview .empty{color:var(--mute);font-size:14px}
.stage{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
header{flex-wrap:wrap}
#cap.bad{color:#c62828}
.pcard{touch-action:none;-webkit-user-drag:none}
.pcard img{pointer-events:none}
.card.pick{box-shadow:0 0 0 3px var(--gold),0 0 16px 4px rgba(226,178,90,.9)}
.card .lv{position:absolute;top:1px;left:1px;z-index:2;font-size:8px;line-height:1.2;padding:0 2px;border-radius:2px;background:rgba(0,0,0,.72);color:var(--gold)}
.card .lv:empty{display:none}.card .lv.mod{background:var(--ember);color:#fff}
.toast{position:absolute;left:4%;right:4%;transform:translateY(-50%);z-index:400;text-align:center;font-size:14px;line-height:1.35;
  background:#fff;color:var(--bone);border:1px solid var(--gold);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.18);padding:9px 12px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}.toast.bad{border-color:var(--ember);color:#b3261e;box-shadow:0 0 14px rgba(106,60,156,.4)}
.selbar{background:rgba(226,178,90,.12);border:1px solid var(--gold);border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.selbar p{margin:0;font-size:15px}
.pstat{font-size:14px;color:var(--mute)}
.pstatrow{display:flex;align-items:center;gap:9px}
.bigcard{position:fixed;inset:0;z-index:300;background:rgba(20,16,16,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.bigcard img{max-width:100%;max-height:calc(100% - 40px);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.bigcard p{color:#fff;opacity:.75;margin:10px 0 0;font-size:14px}
#mImg{cursor:zoom-in}
.owe{display:none;flex:none;vertical-align:-1px;margin-right:8px;width:13px;height:13px;border-radius:50%;background:#bdb5ab;border:1px solid rgba(0,0,0,.45);transition:background .3s,box-shadow .3s}
body.playing .owe{display:inline-block}
.owe.on{background:#ff3b30;border-color:#ffb3ad;box-shadow:0 0 6px 2px rgba(255,59,48,.75);animation:owe 1.1s ease-in-out infinite}
@keyframes owe{50%{box-shadow:0 0 14px 5px rgba(255,59,48,.9)}}
#pUndo:disabled{opacity:.4}
.dmode{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--mute)}
.dmode button{padding:6px 9px;font-size:13px}
.dmode button.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.mbtns{display:flex;gap:8px;flex:none}.mbtns button{flex:1;padding:9px}
#mCoach.on{background:rgba(226,178,90,.18)}
.coach h4{font-family:var(--display);color:var(--gold);margin:4px 0 2px;font-size:13px;font-weight:500;letter-spacing:.04em}
.coach ul{margin:0;padding-left:18px;font-size:13px;line-height:1.4;display:grid;gap:4px}
.coach .now li{color:#8a4b00}.coach .dont li::marker{color:#c62828}
.lvrow{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mute)}.lvrow button{padding:4px 10px}
.sheet{max-width:420px;width:100%;max-height:82vh;overflow:auto;background:#fbfaf8;border:1px solid var(--gold);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:7px}
.sheet .hd{display:flex;gap:10px;align-items:center;margin-bottom:2px}
.sheet .hd img{width:52px;border-radius:3px}
.sheet button.used{opacity:.45;text-decoration:line-through}
.sheet .wn{font-size:14px;line-height:1.4;background:#fff;border:1px solid rgba(168,116,31,.35);border-radius:8px;padding:8px 10px}
.sheet .wn.best{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.sheet .wn ul{margin:4px 0 0;padding-left:18px}.sheet .wn li{margin:3px 0}
.sheet ol.bp{margin:0;padding-left:22px}.sheet ol.bp li{margin:5px 0}
.sheet .wnote{font-size:12px;color:var(--mute);margin:0}
.sheet h3{font-family:var(--display);color:var(--gold);margin:0;font-size:16px}
.sheet .hd p{margin:2px 0 0;font-size:13px;color:var(--mute)}
.sheet button{text-align:left}.sheet button.cancel{text-align:center;margin-top:4px}
@media (min-width:980px){.main{display:grid;grid-template-columns:minmax(0,600px) minmax(0,1fr);gap:18px;align-items:start}}
.status{font-size:13px;color:var(--mute);text-align:center}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card.act,.flash,.banner,.opts button.bad{animation:none}}

h1{color:var(--ember);letter-spacing:.06em}
.tabs button.on{background:var(--ember);border-color:var(--ember)}
button{border-color:rgba(106,60,156,.32)}
button:hover{border-color:var(--ember);background:rgba(106,60,156,.07)}
button:focus-visible{outline-color:var(--ember)}
.dmode button.on{background:var(--ember);border-color:var(--ember)}
.caption .k,.mbox h3,.sheet h3,.pview h3,.deckview h2,.coach h4{color:var(--ember)}
.linebar{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px;color:var(--mute)}
.linebar label{display:flex;gap:8px;align-items:center;color:var(--bone);font-weight:600}
.linebar #lineBlurb{flex:1 1 240px;font-size:13px;line-height:1.35}
.opts button.nextq{text-align:center;font-weight:600}
.sheet button.pk{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sheet button.pk small{color:var(--mute);font-size:12px;white-space:nowrap}
.sheet button.pk.on{background:rgba(106,60,156,.12);border-color:var(--ember);box-shadow:0 0 0 1px var(--ember) inset}
.sheet button.pk:disabled{opacity:.5}
.sheet button.primary.cancel{background:var(--ember);color:#fff}
.sheet button.primary.cancel:disabled{opacity:.45}
.stylesview{display:none;max-width:720px}
.stylesview .sintro{margin:4px 0 14px;color:var(--mute);font-size:15px;max-width:62ch}
.style{border-left:3px solid var(--ember);padding:2px 0 4px 14px;margin:0 0 22px}
.style h2{font-family:var(--display);font-weight:400;color:var(--ember);font-size:21px;margin:0 0 6px;letter-spacing:.03em}
.style p{margin:0 0 8px;max-width:64ch;line-height:1.5}
.style p.what{font-size:17px;color:var(--bone)}
.style p.watch{font-size:14px;color:#7a4a00}
.style .chips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px}
.style .chip{min-height:32px;padding:4px 10px;font-size:13px;border-radius:16px;background:#fff}
.stylesview .snote{font-size:13px;color:var(--mute);max-width:64ch;border-top:1px solid rgba(0,0,0,.1);padding-top:10px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Dark Magician</h1>
    <div class="tabs" role="tablist">
      <button id="tWatch" class="on">Watch</button>
      <button id="tPractice">Practice</button>
      <button id="tPlay">Play</button>
      <button id="tDeck">Deck</button>
      <button id="tStyles">Styles</button>
    </div>
  </header>

  <div class="main" id="duelview">
    <div>
      <div class="lp"><span>Opponent<b>8000</b></span><span><span id="owe" class="owe" role="status" aria-label=""></span>You<b>8000</b></span></div>
      <div class="stage" id="stage"></div>
      <div class="status" id="status">Loading card images…</div>
    </div>
    <div class="panel">
      <div class="caption"><div class="k" id="stepk"></div><p id="cap"></p></div>
      <div id="lineBar" class="linebar"><label for="lineSel">Line <select id="lineSel"></select></label><span id="lineBlurb"></span></div>
      <div id="watchCtrls" class="ctrls">
        <button id="bPrev" aria-label="Previous step">◀ Back</button>
        <button id="bPlay" class="primary">Auto play</button>
        <button id="bNext" aria-label="Next step">Next ▶</button>
        <button id="bReset">Restart</button>
        <label class="sp">Speed
          <select id="speed"><option value="1.6">Slow</option><option value="1" selected>Normal</option><option value="0.6">Fast</option></select>
        </label>
      </div>
      <div id="practice" style="display:none" class="panel">
        <div class="k" style="font-family:var(--display);color:var(--gold)">What’s your next move?</div>
        <div class="opts" id="opts"></div>
        <div class="fbk" id="fbk"></div>
        <div class="ctrls"><button id="qUndo" disabled>↶ Undo</button><button id="pReset">Start over</button><span class="sp" id="score"></span></div>
      </div>
      <div id="playCtrls" style="display:none" class="panel">
        <div id="selBar" class="selbar" style="display:none"><p id="selT"></p>
          <div class="ctrls"><button id="selOk" class="primary">Confirm</button><button id="selNo">Cancel</button></div></div>
        <div class="ctrls"><button id="pNext" class="primary">End turn</button><button id="pUndo" disabled>↶ Undo</button><button id="pBan">Banished (0)</button><button id="pNew">New duel</button><button id="pWhat">💡 What now?</button></div>
        <div class="pstat" id="pstat"></div>
        <div class="dmode" id="dmode">Play cards as:
          <button data-m="normal" class="on">Normal Summon</button><button data-m="set">Set</button><button data-m="spa">Special ATK</button><button data-m="spd">Special DEF</button></div>
      </div>
      <p id="hint" style="font-size:14px;color:var(--mute);margin:0">Tap any card on the field or in your hand to see its art and full text.</p>
    </div>
  </div>

  <div class="deckview" id="deckview"></div>
  <div class="stylesview" id="stylesview"></div>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="mbox" id="mbox"></div>
</div>

<script>
const API = "https://db.ygoprodeck.com/api/v7/cardinfo.php?name=";

const BAKED = {"Dark Magician": {"id": 36996508, "desc": "The ultimate wizard in terms of attack and defense.", "type": "Normal Monster", "level": 7, "attribute": "DARK", "race": "Spellcaster", "atk": 2500, "def": 2100}, "Magicians' Souls": {"id": 97631303, "desc": "You can send up to 2 Spells/Traps from your hand and/or field to the GY; draw that many cards. If this card is in your hand: You can send 1 Level 6 or higher Spellcaster monster from your Deck to the GY, then activate 1 of these effects;\n● Special Summon this card.\n● Send this card to the GY, then, you can Special Summon 1 \"Dark Magician\" or 1 \"Dark Magician Girl\" from your GY.\nYou can only use each effect of \"Magicians' Souls\" once per turn.", "type": "Effect Monster", "level": 1, "attribute": "DARK", "race": "Spellcaster", "atk": 0, "def": 0}, "Magikuriboh": {"id": 31699677, "desc": "During the Main or Battle Phase, if you took damage by battle or an opponent's card effect this turn (Quick Effect): You can send this card from your hand to the GY; Special Summon 1 \"Dark Magician\" or 1 \"Dark Magician Girl\" from your Deck or GY. If a face-up Spellcaster monster(s) you control is destroyed by battle or an opponent's card effect: You can add this card from the GY to your hand. You can only use each effect of \"Magikuriboh\" once per turn.", "type": "Effect Monster", "level": 1, "attribute": "DARK", "race": "Fiend", "atk": 300, "def": 200}, "Magician's Rod": {"id": 7084129, "desc": "When this card is Normal Summoned: You can add 1 Spell/Trap from your Deck to your hand, that mentions \"Dark Magician\". During your opponent's turn, if you activate a Spell/Trap Card or effect while this card is in your GY (except during the Damage Step): You can Tribute 1 Spellcaster monster; add this card to your hand. You can only use each effect of \"Magician's Rod\" once per turn.", "type": "Effect Monster", "level": 3, "attribute": "DARK", "race": "Spellcaster", "atk": 1600, "def": 100}, "Dark Magician Girl": function stateAt(i){
  const s={}; let t=0; for(const id in INIT) s[id]={z:INIT[id], f:"up", t:t++};
  for(let k=1;k<=i;k++) for(const [id,z,f] of STEPS[k].ops) s[id]={z, f:f||"up", t:t++};
  return s;
}

let cur=0;
function render(i, animate=true){
  const s=stateAt(i), step=STEPS[i];
  const hand=Object.keys(s).filter(id=>s[id].z==="hand").sort((a,b)=>s[a].t-s[b].t);
  const gy=Object.keys(s).filter(id=>s[id].z==="gy").sort((a,b)=>s[a].t-s[b].t);
  const hs = 1.2, hw=G.cw*hs, n=hand.length;
  const gap = n>1 ? Math.min(hw*1.08, (G.W-hw-16)/(n-1)) : 0;
  const hx0 = G.W/2 - gap*(n-1)/2, hy = G.boardH + 8 + G.handH/2;
  for(const id in s){
    const el=cardEls[id], c=s[id]; let x,y,sc=1,op=1,zi=10;
    if(!animate) el.style.transition="none";
    el.style.width=G.cw+"px"; el.style.height=G.ch+"px";
    if(c.z==="hand"){ const k=hand.indexOf(id); x=hx0+k*gap; y=hy; sc=hs; zi=50+k; }
    else if(c.z==="gy"){ const k=gy.indexOf(id); [x,y]=center("gy"); y-=k*1.5; zi=20+k; }
    else if(c.z==="deck"||c.z==="extra"||c.z==="ban"){ [x,y]=center(c.z==="ban"?"gy":c.z); op=0; sc=.92; zi=2; }
    else { [x,y]=center(c.z); zi=30; }
    el.style.transform=`translate(${x-G.cw/2}px,${y-G.ch/2}px) scale(${sc})`;
    el.style.opacity=op; el.style.zIndex=zi; el.style.pointerEvents=op?"auto":"none";
    el.classList.toggle("down", c.f==="down");
    el.classList.toggle("act", !!(step.act && step.act.includes(id)));
    if(!animate){ el.offsetHeight; el.style.transition=""; }
  }
  updatePileCounts();
  document.getElementById("stepk").textContent = i===0 ? "Opening hand" : step.opp ? `Opponent’s turn · Step ${i} of ${STEPS.length-1}` : `${(step.turn||1)>1?`Turn ${step.turn} · `:""}Step ${i} of ${STEPS.length-1}`;
  document.getElementById("cap").textContent = step.cap;
  if(animate && step.flash) setTimeout(()=>fx(step.flash, step.banner), 500);
}
function fx(zone, text){
  const [x,y]=center(zone), r=G.cw*1.3;
  const f=document.createElement("div"); f.className="flash";
  f.style.cssText=`width:${r*2}px;height:${r*2}px;left:${x-r}px;top:${y-r}px`;
  stage.appendChild(f); setTimeout(()=>f.remove(),1100);
  if(text){ const b=document.createElement("div"); b.className="banner"; b.textContent=text;
    b.style.top=(G.rowH*2.5 - 14)+"px"; b.style.fontSize=Math.max(18,G.W/16)+"px";
    stage.appendChild(b); setTimeout(()=>b.remove(),1500); }
}

function expand(list){ const o=[]; list.forEach(([q,n])=>{for(let i=0;i<q;i++)o.push(n)}); return o; }
function pileContents(k, i){
  const st=stateAt(i);
  if(k==="gy") return Object.keys(st).filter(id=>st[id].z==="gy").sort((a,b)=>st[b].t-st[a].t).map(id=>INST[id]);
  const src = k==="extra" ? expand(DECK["Extra Deck"]) : expand([...DECK.Monsters,...DECK.Spells,...DECK.Traps]);
  for(const id in st){ const home = k==="extra" ? INIT[id]==="extra" : (INIT[id]==="deck"||INIT[id]==="hand");
    if(home && st[id].z!==k){ const j=src.indexOf(INST[id]); if(j>=0) src.splice(j,1); } }
  return src;
}
function updatePileCounts(){
  if(mode==="play"){ const set=(k,n)=>{ const el=stage.querySelector(`.pile[data-k="${k}"] .n`); if(el) el.textContent=n; };
    set("deck",P.deck.length); set("extra",Object.values(P.cards).filter(c=>c.where==="extra").length); return; }
  ["deck","extra"].forEach(k=>{ const el=stage.querySelector(`.pile[data-k="${k}"] .n`); if(el) el.textContent=pileContents(k,cur).length; });

const PNAME={gy:"Graveyard",deck:"Deck",extra:"Extra Deck"};
function openPile(k){
  if(mode==="play") return openPlayPile(k);
  const list=pileContents(k,cur); const counts={}; const order=[];
  list.forEach(n=>{ if(!counts[n]){counts[n]=0;order.push(n);} counts[n]++; });
  if(k!=="gy") order.sort();

  box.innerHTML=`<h3>${PNAME[k]} (${list.length})</h3>` + (list.length?`<div class="pg">`+order.map(n=>{const d=DB[n]||{};
    return `<div class="pc" data-n="${n.replace(/"/g,"&quot;")}">${d.small||d.img?`<img src="${d.small||d.img}" alt="">`:n}${counts[n]>1?`<span class="q">×${counts[n]}</span>`:""}</div>`}).join("")+`</div>`
    :`<div class="empty">No cards here yet.</div>`) + `<button id="mClose">Close</button>`;
  box.querySelectorAll(".pc").forEach(e=>e.onclick=()=>openCard(e.dataset.n));
  document.getElementById("mClose").onclick=closeCard;
  modal.classList.add("on");
}
function pileAt(x,y){
  for(const k of ["gy","deck","extra"]){ const [cx,cy]=center(k); if(Math.abs(x-cx)<G.cell/2 && Math.abs(y-cy)<G.rowH/2) return k; }
  return null;
}
(function(){
  let t=null, fired=false, sx=0, sy=0;
  stage.addEventListener("pointerdown",e=>{
    const r=stage.getBoundingClientRect(); const k=pileAt(e.clientX-r.left,e.clientY-r.top); fired=false; if(!k) return;
    sx=e.clientX; sy=e.clientY; t=setTimeout(()=>{ fired=true; if(navigator.vibrate) navigator.vibrate(15); openPile(k); },450);
  });
  const cancel=()=>{ clearTimeout(t); t=null; };
  stage.addEventListener("pointermove",e=>{ if(t && Math.hypot(e.clientX-sx,e.clientY-sy)>10) cancel(); });
  stage.addEventListener("pointerup",cancel); stage.addEventListener("pointercancel",cancel);
  stage.addEventListener("click",e=>{
    if(suppressClick){ suppressClick=false; e.stopPropagation(); return; }
    if(fired){ e.stopPropagation(); e.preventDefault(); fired=false; return; }
    const r=stage.getBoundingClientRect(); const k=pileAt(e.clientX-r.left,e.clientY-r.top);
    if(k==="deck"||k==="extra"||(k==="gy"&&!e.target.closest(".card"))) openPile(k);
  },true);
  stage.addEventListener("contextmenu",e=>{ if(pileAt(e.clientX-stage.getBoundingClientRect().left,e.clientY-stage.getBoundingClientRect().top)) e.preventDefault(); });
})();

function go(i){ cur=Math.max(0,Math.min(STEPS.length-1,i)); render(cur); }
function stop(){ clearTimeout(timer); timer=null; bPlay.textContent="Auto play"; }
function tick(){ if(cur>=STEPS.length-1){ stop(); return; }
  go(cur+1); timer=setTimeout(tick, 3200*parseFloat(document.getElementById("speed").value)); }
bPlay.onclick=()=>{ if(timer){ stop(); return; } if(cur>=STEPS.length-1) go(0); bPlay.textContent="Pause";
  timer=setTimeout(tick, 600); };
document.getElementById("bNext").onclick=()=>{ stop(); go(cur+1); };
document.getElementById("bPrev").onclick=()=>{ stop(); go(cur-1); };
document.getElementById("bReset").onclick=()=>{ stop(); go(0); };
document.addEventListener("keydown",e=>{
  if(document.getElementById("modal").classList.contains("on")){ if(e.key==="Escape") closeCard(); return; }
  if(mode!=="watch") return;
  if(e.key==="ArrowRight"){ stop(); go(cur+1); } else if(e.key==="ArrowLeft"){ stop(); go(cur-1); }
  else if(e.key===" "){ e.preventDefault(); bPlay.click(); }
});

let mode="watch", right=0, tries=0, qHist=[], qTimer=null;
function qUndoBtn(){ const b=document.getElementById("qUndo"); if(b) b.disabled=!qHist.length; }
function qUndo(){
  const h=qHist.pop(); if(!h) return; clearTimeout(qTimer);
  right=h.right; tries=h.tries; go(h.cur); ask(); qUndoBtn();
  const fb=document.getElementById("fbk"); fb.className="fbk"; fb.textContent="Went back one move. Try it again.";
}
function qReset(){ qHist=[]; clearTimeout(qTimer); qUndoBtn(); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function ask(){
  const opts=document.getElementById("opts"), fb=document.getElementById("fbk"); opts.innerHTML="";
  document.getElementById("score").textContent = tries ? `First-try correct: ${right} of ${tries}` : "";
  if(cur>=STEPS.length-1){ fb.className="fbk ok"; fb.textContent="Line complete. Pick another line above, or tap Start over to run this one again."; return; }
  const nx=STEPS[cur+1]; let missed=false;
  qUndoBtn();
  if(nx.auto){ fb.className="fbk"; fb.textContent=nx.opp?"Your opponent takes their turn…":"Drawing a card…"; go(cur+1); qTimer=setTimeout(ask,1800); return; }

function nowTips(n,u){
  const out=[]; if(u==null || !P.cards || !P.cards[u]) return out;
  const c=P.cards[u], k=KIND[n], w=c.where, d=info(n);
  if(w==="hand" && k==="mon"){
    const L=d&&d.level; if(/Ritual/.test(d&&d.type||"")) out.push("It’s a Ritual Monster, so it can’t be Normal Summoned. Activate Chaos Form or Secrets of Dark Magic, then drag it onto the field."); else if(L>=7) out.push(`It’s Level ${L}, so a Normal Summon needs 2 Tributes.`); else if(L>=5) out.push(`It’s Level ${L}, so a Normal Summon needs 1 Tribute.`);
    out.push(P.normalUsed? "You’ve already used your Normal Summon this turn. To play it now, you need a card effect that Special Summons it." : "Your Normal Summon is still available this turn.");
    out.push("Pick Normal Summon, Set, or Special below the field, then drag it onto a Monster Zone.");
  }
  if(w==="hand" && k==="spell") out.push("Drag it onto a Spell & Trap Zone to activate it, or choose Set below the field first to Set it face-down."+(subType(n)==="Field"?" Field Spells go in the Field Zone.":""));
  if(w==="hand" && k==="trap") out.push("Drag it onto a Spell & Trap Zone to Set it. You can activate it starting next turn.");
  if(w==="extra"){ const req=d? d.desc.split("\n")[0] : ""; if(req) out.push(`Materials: ${req}`);
    if(P.lock && !matchWords(n,P.lock.words)) out.push(`Locked out: after ${P.lock.src}, you can only Special Summon ${P.lock.text} monsters from the Extra Deck this turn.`);
    out.push("Activate a Fusion card or effect first, then open your Extra Deck, drag it onto a Monster Zone and pick the materials."); }
  if(isZone(w) && c.pos==="set" && k==="trap") out.push(c.placedTurn===P.turn? "You Set it this turn, so it can’t be activated until your next turn." : "It’s ready. Hold it to activate it.");
  if(isMonZone(w)){ if(c.placedTurn===P.turn) out.push("It was put on the field this turn, so its battle position can’t change yet.");
    else out.push("Double-tap it to change its battle position."); }
  if(w==="deck"){ const ok=["hand","gy","field"].filter(dst=>!deckCheck(u,dst).err); out.push(ok.length? `An effect you used lets you take this card: ${ok.map(x=>DEST_WORD[x]).join(" or ")}.` : "No effect you’ve used right now lets this card leave your Deck."); }
  if(["gy","ban","deck"].includes(w)) out.push("Drag it out of the pile onto the field or your hand when a card effect lets you."+(w==="gy"?" Hold it to use an effect it has in the GY.":""));
  const used=P.used[n]||0; if(used) out.push(`You’ve already used ${n}’s effect${used>1?"s":""} this turn.`);
  return out;
}
function coachHTML(n,u){

    `<h4>What to do</h4><ul>${li(t.do)}</ul><h4>What not to do</h4><ul class="dont">${li(t.dont)}</ul></div>`;
}

const P = {};

const MZ=["m0","m1","m2","m3","m4"], SZ=["s0","s1","s2","s3","s4"], EMZ=["emzL","emzR"];

const KIND={}; for(const [sec,l] of Object.entries(DECK)) l.forEach(([q,n])=>KIND[n]= sec==="Monsters"?"mon":sec==="Spells"?"spell":sec==="Traps"?"trap":"extra");
const isZone=k=>FIELD.includes(k), isMonZone=k=>MZ.includes(k)||EMZ.includes(k);
const info=n=>DB[n]||null;
const isMonKind=n=>KIND[n]==="mon"||KIND[n]==="extra";
function lvl(u){ const c=P.cards[u], d=info(c.n); if(!d||d.level==null) return null; return Math.max(1,d.level+(c.lvMod||0)); }
const ALIAS={"Scarred Dragon Archfiend":"Red Dragon Archfiend"};
const nameIs=(u,q)=>{ const c=P.cards[u]; return c.n===q || (ALIAS[c.n]===q && (isZone(c.where)||c.where==="gy")); };
function tuner(n){ const d=info(n); return d? /Tuner/.test(d.type) : null; }
function subType(n){ const d=info(n); return d? d.race : null; }
function occ(k){ for(const u in P.cards) if(P.cards[u].where===k) return u; return null; }
function monsters(){ return Object.keys(P.cards).filter(u=>isMonZone(P.cards[u].where)); }
function freeMZ(){ return MZ.find(k=>!occ(k)); }
function freeSZ(){ return SZ.find(k=>!occ(k)); }
const byT=(a,b)=>P.cards[a].t-P.cards[b].t;
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");

function holdCard(u){

function zoneAt(x,y){
  for(const k in Z){ const [cx,cy]=center(k); if(Math.abs(x-cx)<G.cell/2 && Math.abs(y-cy)<G.rowH/2) return k; }
  return null;
}

function renderPlay(animate=true){
  if(!P.cards) return;
  const ids=Object.keys(P.cards);
  const hand=ids.filter(u=>P.cards[u].where==="hand").sort(byT);
  const gy=ids.filter(u=>P.cards[u].where==="gy").sort(byT);
  const hs=1.2, hw=G.cw*hs, n=hand.length;
  const gap=n>1? Math.min(hw*1.08,(G.W-hw-16)/(n-1)) : 0;
  const hx0=G.W/2-gap*(n-1)/2, hy=G.boardH+8+G.handH/2;
  for(const u of ids){
    const el=pEls[u], c=P.cards[u]; let x,y,sc=1,zi=10,rot=0,show=true;
    if(c.where==="hand"){ const k=hand.indexOf(u); x=hx0+k*gap; y=hy; sc=hs; zi=50+k; }
    else if(c.where==="gy"){ const k=gy.indexOf(u); [x,y]=center("gy"); y-=k*1.2; zi=20+k; }
    else if(isZone(c.where)){ [x,y]=center(c.where); zi=30; if(isMonZone(c.where) && (c.pos==="def"||c.pos==="set")) rot=90; }
    else show=false;
    if(!show){ el.style.display="none"; continue; }
    el.style.width=G.cw+"px"; el.style.height=G.ch+"px";
    if(el.style.display==="none"){
      el.style.display="";
      const src=["deck","extra","gy"].includes(c.prev)?c.prev:null;
      if(src && animate){ const [px,py]=center(src); el.style.transition="none";
        el.style.transform=`translate(${px-G.cw/2}px,${py-G.ch/2}px)`; el.offsetHeight; el.style.transition=""; }
    }
    if(!animate) el.style.transition="none";
    el.style.transform=`translate(${x-G.cw/2}px,${y-G.ch/2}px) scale(${sc}) rotate(${rot}deg)`;
    el.style.zIndex=zi; el.style.pointerEvents = c.where==="gy" ? "none" : "auto";
    el.classList.toggle("down", c.pos==="set");
    el.classList.toggle("pick", !!(P.sel && P.sel.picked.includes(u)));
    const L=isMonZone(c.where)&&c.pos!=="set"? lvl(u) : null;
    const lv=el.querySelector(".lv"); lv.textContent = L!=null? "★"+L : ""; lv.classList.toggle("mod", !!c.lvMod);
    if(!animate){ el.offsetHeight; el.style.transition=""; }
  }
  updatePileCounts(); pstat(); track();
}

function tapCard(u){
  const c=P.cards[u];
  if(P.sel){
    if(!isMonZone(c.where)) return no("Pick monsters on your field.");
    if(P.sel.kind==="synchro" && c.pos==="set") return no("Face-down monsters can’t be used as Synchro Material.");
    const p=P.sel.picked, i=p.indexOf(u); i>=0? p.splice(i,1) : p.push(u);
    renderPlay();
    if(P.sel.need && p.length===P.sel.need) P.sel.done([...p]);
    return;
  }
  openCard(c.n,u);
}

// ---- Once-per-turn checks ----
// The "If ..." condition a card's effect needs before it can be used
/* condErr: replaced below */
function setLock(src,text){
  const words=text.trim().split(/\s+/);
  if(P.lock){ P.lock.words=[...new Set(P.lock.words.concat(words))]; P.lock.text=P.lock.words.join(" "); P.lock.src+=" and "+src; }
  else P.lock={src,text:text.trim(),words};
  return ` From now on this turn you can only Special Summon ${P.lock.text} monsters from the Extra Deck.`;
}
// "You cannot Special Summon from the Extra Deck ... the turn you activate (either of) this card's effect(s)"
function turnLock(n,e){
  const all=effectsOf(n);
  for(const x of all){ const m=/cannot Special Summon monsters from the Extra Deck,?(?: for the rest of this turn,?)? except ([^.,]+?) Monsters?,? the turn you activate (either of this card's effects|this effect)/i.exec(x.text)
      || (/^You cannot Special Summon monsters from the Extra Deck the turn you activate (this effect)/i.test(x.text) && /except ([^.,]+?) Monsters?/i.exec(x.text));
    if(!m) continue;
    const either=/either/i.test(x.text);
    if(either || (e && e.i===x.i-1)) return setLock(n,m[1]);
  }
  return "";
}
/* optCheck: replaced below */
function matchWords(n,words){
  const d=info(n); if(!d) return true;
  return words.every(w=> d.attribute===w.toUpperCase() || d.race===w || d.type.includes(w));
}

/* tryNormal: replaced below */
function trySpecial(u,zone,pos,how){
  const c=P.cards[u], ex=KIND[c.n]==="extra", src=locOf(c.where);
  if(ex && !c.proper) return no(`${c.n} was never properly Summoned from the Extra Deck, so it can’t be Special Summoned from the ${c.where==="gy"?"GY":"banishment"}.`);
  if(zone && EMZ.includes(zone) && !ex) return no("Only monsters Summoned from the Extra Deck can go in an Extra Monster Zone.");
  if(zone && occ(zone)) return no("That zone already has a card in it.");
  const z = zone || freeMZ() || (ex && !EMZ.some(occ) ? "emzL" : null);
  if(!z) return no("All your Monster Zones are full.");
  const from=c.where==="hand"?"your hand":c.where==="gy"?"your GY":c.where==="deck"?"your Deck":"banishment";
  const own = !ex && (src==="hand"||src==="gy") ? effectsOf(c.n).find(e=>e.selfSS && e.locs.includes(src)) : null;
  let grant=null;
  if(!how && (src==="hand"||src==="gy")){
    if(src==="gy"){ const r=permCheck(u,"gy","field"); grant=r.g||null;
      if(!own && !grant) return no(r.err); }
    else grant=(P.grants||[]).find(g=>g.dest==="field"&&(g.from||[]).includes("hand")&&g.except!==c.n&&fitsPhrase(c.n,g.phrase))||null;
    if(own && grant) return sheet(c.n,null,`How are you Special Summoning ${c.n}?`,[["With its own effect",()=>trySpecial(u,zone,pos,"own")],[`With ${grant.src}’s effect`,()=>trySpecial(u,zone,pos,"other")]]);
    how = own? "own" : grant? "other" : null;
  }
  if(how==="own" && own){
    const ce=condErr(u,own); if(ce) return no(ce);
    const way=/You can only Special Summon "[^"]+" once per turn this way/i.test(info(c.n).desc);
    if(way && P.used["ss:"+c.n]) return no(`You can only Special Summon ${c.n} this way once per turn, and you already did this turn.`);
    const go=()=>{
      if(way) P.used["ss:"+c.n]=1;
      place(u,z,{pos,placedTurn:P.turn});
      let extra="";
      const m=/cannot Special Summon monsters from the Extra Deck for the rest of this turn, except ([^.,]+?) monsters/i.exec(own.text)
        || /If Summoned this way, you cannot Special Summon monsters from the Extra Deck for the rest of this turn, except ([^.,]+?) monsters/i.exec(info(c.n).desc);
      if(m) extra=setLock(c.n,m[1]);
      extra+=turnLock(c.n,own);
      if(own.cost) owe(u,own);
      const gt=grantFrom(c.n,own.text);
      say(`Special Summoned ${c.n} from ${from} with its own effect, in ${pos==="atk"?"Attack":"Defense"} Position.${extra}${gt}`);
      renderPlay();
    };
    return !way && /You can only use (each effect|this effect) of/i.test(info(c.n).desc)? optCheck(c.n,go,own) : go();
  }
  if(how==="other"){
    const g = grant || (src==="gy"? permCheck(u,"gy","field").g : (P.grants||[]).find(g=>g.dest==="field"&&(g.from||[]).includes("hand")&&g.except!==c.n&&fitsPhrase(c.n,g.phrase)));
    if(src==="gy" && !g) return no(permCheck(u,"gy","field").err);
    if(g) useGrant(g);
    place(u,z,{pos,placedTurn:P.turn});
    say(`Special Summoned ${c.n} from ${from} with ${g?g.src+"’s":"a card’s"} effect, in ${pos==="atk"?"Attack":"Defense"} Position.`);
    return renderPlay();
  }
  if(src==="hand"){
    const ce=own? condErr(u,own) : "";
    return no(ce || (P.normalUsed
      ? `You’ve already used your Normal Summon this turn, and no card effect is letting you Special Summon ${c.n} from your hand right now.`
      : `No card effect is letting you Special Summon ${c.n} from your hand right now. To Normal Summon it instead, pick Normal Summon in “Play cards as”.`));
  }
  place(u,z,{pos,placedTurn:P.turn});
  say(`Special Summoned ${c.n} from ${from} in ${pos==="atk"?"Attack":"Defense"} Position. Remember this needs a card effect that allows it.`);
  renderPlay();
}

function pileGesture(el,u){
  el.addEventListener("pointerdown",e=>{
    e.preventDefault(); const sx=e.clientX, sy=e.clientY; let moved=false, long=false;
    const lp=setTimeout(()=>{ if(!moved){ long=true; if(navigator.vibrate) navigator.vibrate(20); closeCard(); holdCard(u); } },500);
    const mv=ev=>{ if(long) return;
      if(!moved && Math.hypot(ev.clientX-sx,ev.clientY-sy)<8) return;
      if(!moved){ moved=true; clearTimeout(lp); closeCard(); startPileDrag(u); }
      pileDragMove(u,ev); };
    const up=ev=>{ clearTimeout(lp); window.removeEventListener("pointermove",mv); window.removeEventListener("pointerup",up); window.removeEventListener("pointercancel",cx);
      if(long) return;
      if(moved){ const r=stage.getBoundingClientRect(); pEls[u].style.transition=""; pEls[u].style.pointerEvents="";
        dropAt(u,ev.clientX-r.left,ev.clientY-r.top,overBan(ev)); renderPlay(); return; }
      openCard(P.cards[u].n,u); };
    const cx=()=>{ clearTimeout(lp); window.removeEventListener("pointermove",mv); window.removeEventListener("pointerup",up); window.removeEventListener("pointercancel",cx); renderPlay(); };
    window.addEventListener("pointermove",mv); window.addEventListener("pointerup",up); window.addEventListener("pointercancel",cx);
  });
}
function startPileDrag(u){
  const el=pEls[u]; el.style.display=""; el.style.width=G.cw+"px"; el.style.height=G.ch+"px";
  el.style.transition="none"; el.style.zIndex=300; el.style.pointerEvents="none"; el.classList.remove("down");
}
function pileDragMove(u,e){ const r=stage.getBoundingClientRect(), el=pEls[u];
  el.style.transform=`translate(${e.clientX-r.left-G.cw/2}px,${e.clientY-r.top-G.ch/2}px) scale(1.3)`; }
function openPlayPile(k){
  if(P.sel) return no("Finish picking cards first, or tap Cancel.");
  let list=Object.keys(P.cards).filter(u=>P.cards[u].where===k);
  if(k==="gy"||k==="ban") list.sort((a,b)=>P.cards[b].t-P.cards[a].t); else list.sort((a,b)=>P.cards[a].n.localeCompare(P.cards[b].n));
  const groups=[]; const seen={};
  list.forEach(u=>{ const n=P.cards[u].n; if(seen[n]) seen[n].q++; else { seen[n]={u,n,q:1}; groups.push(seen[n]); } });
  const box=document.getElementById("mbox"); box.className="pview";
  const title={gy:"Graveyard",deck:"Deck",extra:"Extra Deck",ban:"Banished"}[k];
  box.innerHTML=`<h3>${title} (${list.length})</h3>` + (list.length? `<div class="pg">`+groups.map(g=>{ const d=DB[g.n]||{};
    return `<div class="pc" data-u="${g.u}">${d.small?`<img src="${d.small}" alt="">`:esc(g.n)}${g.q>1?`<span class="q">×${g.q}</span>`:""}</div>`; }).join("")+`</div>`
    : `<div class="empty">No cards here.</div>`) + `<p class="empty" style="margin:0;font-size:13px">Tap a card for details. Drag it out onto the field or your hand.${k==="gy"||k==="ban"?" Hold it to use its effect from here.":""}</p><button id="mClose">Close</button>`;
  box.querySelectorAll(".pc").forEach(e=>pileGesture(e,e.dataset.u));
  document.getElementById("mClose").onclick=closeCard;
  modal.classList.add("on");
}

document.getElementById("pNext").onclick=()=>{

  const h=Object.values(P.cards).filter(c=>c.where==="hand").length;
  if(h>6) return no(`You have ${h} cards in hand. Discard down to 6 before ending your turn.`);
  P.turn++; P.normalUsed=false; P.used={}; P.usedE={}; P.lock=null; P.grants=[]; setDropMode("normal");

  const u=P.deck[P.deck.length-1]; place(u,"hand");

  renderPlay();
};

function effectsOf(n){

    gy:g=>`send ${g.left} ${ph(g.phrase)} from your ${g.from.map(f=>SRC_WORD[f]).join(" or ")} to the GY`,
    field:g=>`${/Set it/.test(g.phrase)?"Set":"Special Summon"} ${g.left} ${ph(g.phrase).replace(/ \(Set it.*\)/,"")} from your ${g.from.map(f=>SRC_WORD[f]).join(" or ")}`};
  return " "+add.map(g=>`You can now ${F[g.dest](g)}.`).join(" ");
}

// ---- Moving cards ----
function place(u,where,o={}){
  const c=P.cards[u]; const i=P.deck.indexOf(u); if(i>=0) P.deck.splice(i,1);
  const wasUpES = c.n==="Eternal Soul" && isZone(c.where) && c.pos==="up";
  let top=false; if(where==="top"){ where="deck"; top=true; }
  if(KIND[c.n]==="extra" && (where==="hand"||where==="deck")) where="extra";
  c.prev=c.where; c.where=where; c.t=++P.t; if(where==="gy") c.gyTurn=P.turn;
  if(!isZone(where)){ delete c.pos; c.lvMod=0; delete c.placedTurn; delete c.posTurn; delete c.toGY; delete c.fxDone; delete c.fusion; delete c.link; delete c.q5; delete c.gaze; }
  if(where==="extra") delete c.proper;
  if(where==="deck"){ if(top) P.deck.push(u); else P.deck.splice(Math.floor(Math.random()*(P.deck.length+1)),0,u); }
  Object.assign(c,o);
  if(isZone(where) && c.prev!==where) delete c.fxDone;
  if(wasUpES && !isZone(where)){
    const ms=monsters(); ms.forEach(m=>{ const mc=P.cards[m]; mc.prev=mc.where; mc.where="gy"; mc.t=++P.t; mc.gyTurn=P.turn; delete mc.pos; delete mc.placedTurn; delete mc.fusion; delete mc.fxDone; });
    if(ms.length) setTimeout(()=>toast(`Eternal Soul left the field face-up, so every monster you control was destroyed.`,true),40);
  }
}

  }
  if(!k || k===w) return;
  if(k.startsWith("o")) return no("That’s your opponent’s side of the field.");
  if(k==="ban") return moveTo(u,"ban",`Banished ${n}${from}.`);
  if(k==="gy") return moveTo(u,"gy", w==="hand"?`Sent ${n} from your hand to the GY.`:`Sent ${n}${from} to the GY.`);
  if(k==="deck"){ if(ex) return no("Extra Deck monsters go back to the Extra Deck, not your main Deck."); if(w==="deck") return; return moveTo(u,"deck",`Shuffled ${n} into your Deck.`); }
  if(k==="extra"){ if(!ex) return no("Only Fusion and Link Monsters go in the Extra Deck."); return moveTo(u,"extra",`Returned ${n} to your Extra Deck.`); }
  if(isZone(w)) return no("You can’t move a card to a different zone without a card effect that lets you.");
  if(mon){
    if(SZ.includes(k)||k==="field") return no("Monsters go in your Monster Zones, the row above your Spell & Trap Zones.");
    if(w==="extra") return startSynchro(u,k);
    if(w==="hand" && ritN(n)) return P.x.rit? tryRitual(u,k) : no(`${n} is a Ritual Monster. Activate Chaos Form or Secrets of Dark Magic first, then drag it onto the field.`);
    const hg = w==="hand" && (P.grants||[]).some(g=>g.dest==="field"&&(g.from||[]).includes("hand")&&fitsPhrase(n,g.phrase));
    if(hg && dropMode==="normal") return trySpecial(u,k,"atk");
    if(w==="hand" && (dropMode==="normal"||dropMode==="set")){
      const ok=tryNormal(u,k,dropMode==="set");
      if(P.normalUsed && P.cards[u].where!=="hand") setDropMode("spa");
      return ok;
    }
    if(ex===false && (w==="gy"||w==="ban") && ritN(n) && !c.proper) return no(`${n} was never properly Ritual Summoned, so it can’t be Special Summoned from there.`);
    return trySpecial(u,k,dropMode==="spd"?"def":"atk");
  }
  if(isMonZone(k)) return no("Spells and Traps go in your Spell & Trap Zones, the bottom row.");
  if(KIND[n]==="trap"){ if(k==="field") return no("Only Field Spells go in the Field Zone."); return trySet(u,k); }
  if(k==="field" && subType(n) && subType(n)!=="Field") return no("Only Field Spells go in the Field Zone.");
  if(SZ.includes(k) && subType(n)==="Field") return no("Field Spells go in the Field Zone, on the left.");
  return dropMode==="set"? trySet(u,k) : tryActivate(u,k);
}

// ---- Status line, Life Points and undo ----
function pstat(){
  document.getElementById("stepk").textContent=`Free play · Turn ${P.turn}`;
  let s = P.normalUsed ? (P.x.extraNS? "Normal Summon: used, plus 1 extra for a Spellcaster" : "Normal Summon: used this turn") : "Normal Summon: available";
  if(P.x.fus) s += ` · Fusion ready (${FUSWHO[P.x.fus]}): drag a Fusion Monster out of your Extra Deck`;
  if(P.x.rit) s += ` · Ritual ready: drag Illusion of Chaos from your hand onto the field`;
  if(P.x.spellAct) s += " · A Spell was activated this turn";
  const gtx=grantText(); if(gtx) s += ` · Waiting: ${gtx}`;
  document.getElementById("pstat").textContent=s;
  const ow=document.getElementById("owe"); ow.classList.toggle("on",!!(P.owed||pendGY())); ow.setAttribute("aria-label",P.owed?"Something still needs to be done":"");
  document.getElementById("pBan").textContent=`Banished (${Object.values(P.cards).filter(c=>c.where==="ban").length})`;
  const lp=document.querySelectorAll(".lp b"); if(lp[1]) lp[1].textContent=P.x.lp;
}
function freshX(lp){ return {fus:null,rit:null,spellAct:false,stAct:false,usedK:{},extraNS:false,nameLock:[],lp:lp==null?8000:lp,miasmaPending:false}; }
function ser(){ return JSON.stringify({cards:P.cards,deck:P.deck,t:P.t,turn:P.turn,normalUsed:P.normalUsed,used:P.used,lock:P.lock,grants:P.grants||[],owed:P.owed||null,x:P.x,dm:dropMode}); }
function undo(){
  if(P.sel) endSelect();
  const h=hist.pop(); if(!h) return no("Nothing to undo yet.");
  const o=JSON.parse(h.s); Object.assign(P,{cards:o.cards,deck:o.deck,t:o.t,turn:o.turn,normalUsed:o.normalUsed,used:o.used,lock:o.lock,grants:o.grants||[],owed:o.owed||null,x:o.x||freshX()});
  setDropMode(o.dm||"normal"); lastState=h.s;
  restoring=true; renderPlay(); restoring=false;
  document.getElementById("pUndo").disabled=!hist.length;
  say(`Undid: ${h.cap}`);
}
function newGame(){
  for(const u in pEls){ pEls[u].remove(); delete pEls[u]; }
  Object.assign(P,{cards:{},deck:[],t:0,turn:1,normalUsed:false,used:{},usedE:{},lock:null,sel:null,grants:[],owed:null,lvOwed:null,x:freshX()}); hist=[]; lastState=null;
  let id=0; const mk=(n,w)=>{ const u="p"+(id++); P.cards[u]={n,where:w,t:0}; return u; };
  const main=[]; ["Monsters","Spells","Traps"].forEach(s=>DECK[s].forEach(([q,n])=>{ for(let i=0;i<q;i++) main.push(mk(n,"deck")); }));
  DECK["Extra Deck"].forEach(([q,n])=>{ for(let i=0;i<q;i++) mk(n,"extra"); });
  P.deck=shuffle(main);
  for(const u in P.cards) makePEl(u);
  for(let i=0;i<5;i++) place(P.deck[P.deck.length-1],"hand");
  endSelect(); setDropMode("normal");
  say("New duel. You drew 5 cards. You’re going first, so there’s no draw this turn. Drag a card onto the field to play it. Tap any card for its details and tips.");
  renderPlay(false);
}
function endTurnDM(){
  if(P.sel) return no("Finish picking cards first, or tap Cancel.");
  if(P.owed) return no(OWE_MSG);
  if(pendGY()) return no("Drag the Spell you activated to your GY first, then end your turn.");
  const h=Object.values(P.cards).filter(c=>c.where==="hand").length;
  if(h>6) return no(`You have ${h} cards in hand. Discard down to 6 before ending your turn.`);
  const gone=Object.keys(P.cards).filter(u=>isZone(P.cards[u].where) && P.cards[u].gaze===P.turn);
  gone.forEach(u=>place(u,"ban"));
  P.turn++; P.normalUsed=false; P.used={}; P.usedE={}; P.lock=null; P.grants=[]; P.x=freshX(P.x.lp); setDropMode("normal");
  const g=gone.length? ` During your opponent’s End Phase, The Gaze of Timaeus banished ${gone.map(u=>P.cards[u].n).join(" and ")}.` : "";
  if(!P.deck.length){ say(`Turn ${P.turn}. Your Deck is empty, so you can’t draw. In a real duel, you’d lose here.${g}`); return renderPlay(); }
  const u=P.deck[P.deck.length-1]; place(u,"hand");
  say(`Turn ${P.turn}. You drew ${P.cards[u].n}. Your Normal Summon and once-per-turn effects are available again.${g}`);
  renderPlay();
}
document.getElementById("pNext").onclick=endTurnDM;

// ---- Coach: what can I do right now? ----
function whatNow(){
  if(!P.cards) return;
  const hand=handC(), H=n=>hand.find(u=>P.cards[u].n===n), F=n=>faceUpMons().find(u=>P.cards[u].n===n), GY=n=>gyC().find(u=>P.cards[u].n===n);
  const inDeck=n=>P.deck.some(u=>P.cards[u].n===n), fieldST=n=>[...SZ,"field"].map(occ).find(u=>u&&P.cards[u].n===n&&P.cards[u].pos==="up");
  const tips=[], add=(p,t)=>tips.push({p,t});
  if(P.owed) add(0,"Finish what you started first: the light is on because a cost is still owed or a card has to go back on top of your Deck.");
  if(pendGY()) add(1,"Drag the Spell you activated to your GY once you’ve applied its effect.");
  if(P.x.fus) add(2,`${FUSWHO[P.x.fus]} is waiting: open your Extra Deck and drag the Fusion Monster you want onto a Monster Zone.`);
  if(P.x.rit) add(2,"Your Ritual Spell is waiting: drag Illusion of Chaos from your hand onto a Monster Zone and pick the Tributes.");
  if(P.grants.length) add(3,"You still have an effect to finish: "+grantText()+". Open the pile and drag the card out.");
  if(H("Illusion of Chaos") && !usedK("Illusion of Chaos","rev")) add(10,"Reveal Illusion of Chaos (hold it) to add Dark Magician or a monster that mentions it. Put a card you don’t need right now back on top.");
  if(H("Preparation of Rites")) add(11,"Activate Preparation of Rites to add Illusion of Chaos, and Chaos Form back from your GY if it’s there.");
  if(H("Magician's Rod") && !P.normalUsed) add(12,"Normal Summon Magician’s Rod, then hold it to add a Spell/Trap that mentions Dark Magician.");
  const rod=F("Magician's Rod"); if(rod && P.cards[rod].nsTurn===P.turn && !(P.cards[rod].fxDone||[]).includes("ns")) add(9,"Hold Magician’s Rod to use its search. Magician’s Salvation is great if you don’t have Eternal Soul yet.");
  if(H("Magician's Salvation") && !usedK("Magician's Salvation","act") && inDeck("Eternal Soul")) add(13,"Activate Magician’s Salvation in your Field Zone and Set Eternal Soul from your Deck.");
  if(H("Apprentice Illusion Magician") && hand.length>=2) add(14,"Special Summon Apprentice Illusion Magician by discarding a card you don’t need. Then hold it to add Dark Magician.");
  const aim=F("Apprentice Illusion Magician"); if(aim && P.cards[aim].placedTurn===P.turn && !(P.cards[aim].fxDone||[]).includes("add") && inDeck(DMN)) add(9,"Hold Apprentice Illusion Magician to add Dark Magician from your Deck.");
  if(H("Magicians' Souls") && !usedK("Magicians' Souls","hand") && P.deck.some(x=>PRED.lv6sc(P.cards[x].n))) add(15,"Hold Magicians’ Souls in your hand: send a Level 6+ Spellcaster from your Deck to the GY, then summon Souls or revive Dark Magician or Dark Magician Girl.");
  if(H("Dark Magical Circle") && !usedK("Dark Magical Circle","act")) add(16,"Activate Dark Magical Circle. It looks at your top 3 cards, so put a card on top first with Illusion of Chaos or Soul Servant if you can.");
  if(H("Soul Servant")) add(17,"Activate Soul Servant to put the Dark Magician card you want most on top of your Deck.");
  if(GY("Soul Servant") && !usedK("Soul Servant","gy") && [...faceUpMons(),...gyC()].some(m=>nameIs(m,DMN)||nameIs(m,DMGN))) add(8,"Hold Soul Servant in your GY and banish it to draw cards.");
  const dmod=Object.keys(P.cards).find(u=>P.cards[u].n==="Dark Magician of Destruction" && P.cards[u].where==="extra");
  if(dmod && P.x.spellAct && !usedK("Dark Magician of Destruction","summon") && faceUpMons().some(m=>raceU(m)==="Spellcaster"&&attrU(m)==="DARK"&&(lvl(m)||0)>=6)) add(7,"You’ve activated a Spell and control a Level 6+ DARK Spellcaster: drag Dark Magician of Destruction out of your Extra Deck and banish that Spellcaster.");
  const dF=F("Dark Magician of Destruction"); if(dF && P.cards[dF].placedTurn===P.turn && !(P.cards[dF].fxDone||[]).includes("add")) add(8,"Hold Dark Magician of Destruction to add a card that mentions Dark Magician. The Gaze of Timaeus is the usual pick.");
  if(H("Timaeus the United Dragon") && !usedK("Timaeus the United Dragon","ss")) add(18,"Special Summon Timaeus the United Dragon by sending a Spellcaster or a Dark Magician Spell/Trap from your hand or field to the GY.");
  if(F("Timaeus the United Dragon") && !usedK("Timaeus the United Dragon","fus")) add(9,"Hold Timaeus to Fusion Summon. With Dark Magician in your hand, Dark Magician the Dragon Knight protects your Spells and Traps.");
  if(H("Chaos Form") && H("Illusion of Chaos")) add(19,"Activate Chaos Form to Ritual Summon Illusion of Chaos. Dark Magician alone is exactly Level 7.");
  if(H("Secrets of Dark Magic") && [...faceUpMons(),...hand].some(m=>nameIs(m,DMN)||nameIs(m,DMGN))) add(20,"Secrets of Dark Magic can Fusion Summon or Ritual Summon now that you have Dark Magician or Dark Magician Girl.");
  if(H("The Eye of Timaeus") && faceUpMons().some(m=>nameIs(m,DMN)||/Dark Magician/.test(P.cards[m].n))) add(21,"The Eye of Timaeus can turn your Dark Magician monster into a Fusion all by itself.");
  if(H("The Gaze of Timaeus")) add(30,"Set The Gaze of Timaeus to use on your opponent’s turn, unless you need a Fusion right now.");
  if(fieldST("Magician's Salvation") && faceUpMons().some(m=>(nameIs(m,DMN)||nameIs(m,DMGN))&&summonedNow(m)) && !usedK("Magician's Salvation","ss") && gyC().some(m=>nameIs(m,DMN)||nameIs(m,DMGN))) add(8,"Hold Magician’s Salvation to revive the other one of Dark Magician / Dark Magician Girl from your GY.");
  const traps=hand.filter(u=>KIND[P.cards[u].n]==="trap"), freeS=SZ.filter(z=>!occ(z)).length;
  if(traps.length && freeS) add(40,`Set your Trap${traps.length>1?"s":""} (${[...new Set(traps.map(u=>P.cards[u].n))].join(", ")}) before you end your turn.`);
  tips.sort((a,b)=>a.p-b.p);
  const box=document.getElementById("mbox"); box.className="sheet";
  const best=tips[0], rest=tips.slice(1,7);
  box.innerHTML=`<div class="hd"><div><h3>What now?</h3><p>Based on your board, hand, GY and the effects you’ve already used this turn.</p></div></div>`+
    (best? `<div class="wn best"><b>Best next move</b><br>${esc(best.t)}</div>` : `<div class="wn best"><b>Nothing left to build</b><br>You’re out of plays this turn. Set any cards you want to keep face-down, then end your turn.</div>`)+
    (rest.length? `<div class="wn"><b>Other options</b><ul>${rest.map(x=>`<li>${esc(x.t)}</li>`).join("")}</ul></div>` : "")+
    `<p class="wnote">These are suggestions from what’s open right now, not a guaranteed best line. A full Best play solver comes in a later update.</p>`;
  const b=document.createElement("button"); b.textContent="Close"; b.className="cancel"; b.onclick=closeCard; box.appendChild(b);
  modal.classList.add("on");
}


// ===== Lines for Watch and Practice =====
let lineIdx=0, lineCtx=null;
function loadLine(L,start=0){
  qReset(); stop(); stage.querySelectorAll(".banner,.flash").forEach(e=>e.remove());
  for(const id in cardEls){ cardEls[id].remove(); delete cardEls[id]; }
  for(const k in INST) delete INST[k]; for(const k in INIT) delete INIT[k];
  Object.assign(INST,L.inst); Object.assign(INIT,L.init);
  STEPS.length=0; L.steps.forEach(s=>STEPS.push(s));
  makeCards(); applyImages();
  if(mode!=="watch" && mode!=="practice"){ for(const id in cardEls) cardEls[id].style.display="none"; return; }
  layout();
  cur=Math.min(start,STEPS.length-1);
  if(mode==="practice"){ right=0; tries=0; render(cur,false); const fb=document.getElementById("fbk"); fb.textContent=""; fb.className="fbk"; ask(); }
  else render(cur,false);
}
function pickLine(i){
  lineIdx=i; const L=LINES[i];
  document.getElementById("lineSel").value=String(i);
  document.getElementById("lineBlurb").textContent=L.blurb;
  loadLine(L);
}
(function(){
  const sel=document.getElementById("lineSel");
  sel.innerHTML=LINES.map((L,i)=>`<option value="${i}">${esc(L.name)}</option>`).join("");
  sel.onchange=()=>pickLine(+sel.value);
  document.getElementById("lineBlurb").textContent=LINES[0].blurb;
})();
function showNext(){
  const opts=document.getElementById("opts"); opts.innerHTML="";
  const b=document.createElement("button"); b.className="primary nextq";
  b.textContent = cur>=STEPS.length-1? "Finish ▶" : "Next move ▶";
  b.onclick=()=>{ const fb=document.getElementById("fbk"); fb.textContent=""; fb.className="fbk"; ask(); };
  opts.appendChild(b); b.focus({preventScroll:true});
}

// ===== Styles: the popular ways to play the deck =====
function buildStyles(){
  const v=document.getElementById("stylesview"); v.innerHTML="";
  const intro=document.createElement("p"); intro.className="sintro";
  intro.textContent="The most common ways people play Dark Magician right now, using the cards in your deck. Tap a card name to read it.";
  v.appendChild(intro);
  STYLES.forEach((s,i)=>{
    const a=document.createElement("article"); a.className="style";
    const li = s.line? LINES.findIndex(L=>L.key===s.line) : -1;
    a.innerHTML=`<h2>${esc(s.name)}</h2><p class="what">${esc(s.what)}</p><p>${esc(s.how)}</p>`+
      `<div class="chips">${s.cards.map(n=>`<button class="chip" data-n="${esc(n)}">${esc(n)}</button>`).join("")}</div>`+
      `<p class="watch">${esc(s.watch)}</p>`+
      (li>=0? `<div class="ctrls"><button class="primary" data-w="${li}">Watch this line</button><button data-p="${li}">Practice it</button></div>` : "");
    v.appendChild(a);
  });
  const note=document.createElement("p"); note.className="snote"; note.textContent=STYLE_NOTE; v.appendChild(note);
  v.querySelectorAll(".chip").forEach(b=>b.onclick=()=>openCard(b.dataset.n));
  v.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{ setMode("watch"); pickLine(+b.dataset.w); window.scrollTo({top:0}); });
  v.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ setMode("practice"); pickLine(+b.dataset.p); window.scrollTo({top:0}); });
}

function setMode(m){
  mode=m; stop(); qReset(); document.body.classList.toggle("playing",m==="play");
  ["Watch","Practice","Play","Deck","Styles"].forEach(x=>document.getElementById("t"+x).classList.toggle("on", x.toLowerCase()===m));
  const off = m==="deck"||m==="styles";
  document.getElementById("duelview").style.display = off ? "none" : "";
  document.getElementById("deckview").style.display = m==="deck" ? "block" : "none";
  document.getElementById("stylesview").style.display = m==="styles" ? "block" : "none";
  document.getElementById("lineBar").style.display = (m==="watch"||m==="practice") ? "" : "none";
  document.getElementById("watchCtrls").style.display = m==="watch" ? "" : "none";
  document.getElementById("practice").style.display = m==="practice" ? "" : "none";
  document.getElementById("playCtrls").style.display = m==="play" ? "" : "none";
  document.getElementById("hint").textContent = m==="play"
    ? "Tap a card for its details and tips. Drag cards to play them. Hold a card to use its effect or activate a Set card. Double-tap a monster to change its position. Tap your GY, Deck or Extra Deck to look inside, and drag cards out of them when an effect lets you."
    : m==="practice" ? "Pick the best move. After a correct answer, read the explanation, then tap Next move." : "Tap any card on the field or in your hand to see its art and full text.";
  for(const id in cardEls) cardEls[id].style.display = (m==="watch"||m==="practice") ? "" : "none";
  for(const u in pEls) if(m!=="play") pEls[u].style.display="none";
  document.getElementById("cap").className="";
  if(m==="practice"){ right=0; tries=0; go(0); const fb=document.getElementById("fbk"); fb.textContent=""; fb.className="fbk"; ask(); }
  if(m==="deck") buildDeck();
  if(m==="styles") buildStyles();
  if(m==="play") requestAnimationFrame(()=>{ layout(); if(!P.cards) newGame(); else { say("Back to your duel."); renderPlay(false); } });
  else if(!off) requestAnimationFrame(()=>{ layout(); render(cur,false); });
}
document.getElementById("tStyles").onclick=()=>setMode("styles");

let rt; window.addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(()=>{ if(mode==="play"){ layout(); renderPlay(false); } else if(mode!=="deck"){ layout(); render(cur,false); } },120); });

(async function init(){
  layout(); makeCards(); render(0,false);
  await loadDB(); if(mode==="play") renderPlay(false); if(mode==="deck") buildDeck();
  const st=document.getElementById("status"); st.textContent="Loading card pictures…";
  const ok=await preloadImages();
  applyImages(); applyPImages(); if(mode==="play") renderPlay(false); if(mode==="deck") buildDeck();
  st.textContent = ok.some(Boolean) ? "" : "Card pictures couldn’t load on this connection. Everything else still works.";
})();

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
